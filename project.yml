name: Gainsday
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Gainsday:
    type: application
    platform: iOS
    sources:
      - Gainsday
    dependencies:
      - target: GainsdayWatch
      - target: GainsdayWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Gainsday
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gainsday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Gainsday/Gainsday.entitlements
        INFOPLIST_KEY_NSCameraUsageDescription: Gainsday uses the camera to capture a photo of your lift so the AI Form Coach can analyze your posture.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Gainsday reads nothing from Health. It only writes your finished strength workouts to Apple Health when you enable sync.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Gainsday saves each finished workout to Apple Health as a Traditional Strength Training workout when sync is enabled.
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]
  GainsdayWatch:
    type: application
    platform: watchOS
    sources:
      - GainsdayWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Gainsday.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GainsdayWatch/Info.plist
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zzoutuo.Gainsday
        INFOPLIST_KEY_CFBundleDisplayName: Gainsday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
  GainsdayWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GainsdayWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Gainsday.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GainsdayWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: GainsdayWidgets/GainsdayWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
